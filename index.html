<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edmund & Simone | Wedding Seating</title>

  <!-- Elegant wedding fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      background:
        radial-gradient(
          circle at top,
          #faf7f3 0%,
          #f5f0e9 55%,
          #eee8df 100%
        );

      color: #403a35;

      font-family: "Montserrat", sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }


    /* =========================================
       MAIN CONTAINER
    ========================================= */

    .page {
      width: 100%;
      max-width: 720px;
    }


    /* =========================================
       MAIN CARD
    ========================================= */

    .card {
      position: relative;

      width: 100%;

      background: rgba(255, 253, 250, 0.96);

      border: 1px solid rgba(119, 106, 94, 0.16);

      padding: 64px 58px 54px;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(65, 57, 49, 0.08),
        0 3px 12px rgba(65, 57, 49, 0.03);
    }


    /* =========================================
       TOP DECORATIVE LINE
    ========================================= */

    .top-line {
      width: 42px;
      height: 1px;

      background: #b6aaa0;

      margin: 0 auto 28px;
    }


    /* =========================================
       MONOGRAM
    ========================================= */

    .monogram {
      width: 82px;
      height: 82px;

      margin: 0 auto 28px;

      border: 1px solid #a89b90;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #6f655d;

      font-family: "Cormorant Garamond", serif;
      font-size: 25px;
      font-weight: 500;

      letter-spacing: 1px;

      position: relative;
    }

    /*
      Small inner circle gives the monogram
      a more refined stationery/wedding-invitation feel.
    */
    .monogram::after {
      content: "";

      position: absolute;

      width: 70px;
      height: 70px;

      border: 1px solid rgba(168, 155, 144, 0.35);

      border-radius: 50%;
    }


    /* =========================================
       COUPLE NAMES
    ========================================= */

    .names {
      font-family: "Cormorant Garamond", serif;

      font-size: clamp(48px, 8vw, 70px);

      font-weight: 500;

      line-height: 0.95;

      color: #39332e;

      letter-spacing: -1px;

      margin-bottom: 18px;
    }

    .ampersand {
      font-size: 0.63em;

      font-weight: 400;

      color: #a09185;

      margin: 0 8px;
    }


    /* =========================================
       EVENT SUBTITLE
    ========================================= */

    .subtitle {
      font-size: 10px;

      font-weight: 500;

      letter-spacing: 3.2px;

      text-transform: uppercase;

      color: #91857a;

      margin-bottom: 48px;
    }


    /* =========================================
       SEARCH SECTION
    ========================================= */

    .search-heading {
      font-family: "Cormorant Garamond", serif;

      font-size: 30px;

      font-weight: 500;

      color: #514941;

      margin-bottom: 7px;
    }

    .search-description {
      font-size: 12px;

      line-height: 1.7;

      color: #958a80;

      margin-bottom: 25px;
    }


    /* =========================================
       SEARCH BOX
    ========================================= */

    .search-container {
      max-width: 540px;

      margin: 0 auto;

      padding: 7px;

      background: #f7f3ee;

      border: 1px solid #e4dcd3;

      border-radius: 6px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .search-row {
      display: flex;

      align-items: stretch;

      gap: 8px;
    }


    /* =========================================
       INPUT
    ========================================= */

    .input-wrapper {
      flex: 1;

      position: relative;

      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;

      left: 18px;

      color: #a79b91;

      font-size: 14px;

      pointer-events: none;
    }

    input {
      width: 100%;

      height: 56px;

      border: 1px solid #ddd4ca;

      border-radius: 4px;

      background: #fffefa;

      color: #403a35;

      padding: 0 18px 0 43px;

      font-family: "Montserrat", sans-serif;

      font-size: 16px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    input::placeholder {
      color: #aaa097;
    }

    input:hover {
      border-color: #cfc4ba;
    }

    input:focus {
      background: #ffffff;

      border-color: #9f9185;

      box-shadow:
        0 0 0 3px rgba(159, 145, 133, 0.12);
    }


    /* =========================================
       SEARCH BUTTON
    ========================================= */

    .search-button {
      height: 56px;

      padding: 0 25px;

      border: none;

      border-radius: 4px;

      background: #70665d;

      color: #fffdfa;

      font-family: "Montserrat", sans-serif;

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 1.4px;

      text-transform: uppercase;

      white-space: nowrap;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .search-button:hover {
      background: #5b524b;

      transform: translateY(-1px);

      box-shadow:
        0 5px 12px rgba(73, 65, 58, 0.14);
    }

    .search-button:active {
      transform: translateY(0);

      box-shadow: none;
    }

    .search-button:focus-visible {
      outline: 2px solid #9f9185;

      outline-offset: 3px;
    }


    /* =========================================
       HELPER TEXT
    ========================================= */

    .hint {
      margin-top: 14px;

      font-size: 10px;

      letter-spacing: 0.2px;

      color: #a1978e;
    }


    /* =========================================
       RESULT
    ========================================= */

    .result {
      display: none;

      max-width: 540px;

      margin: 32px auto 0;

      padding: 31px 24px 28px;

      border-top: 1px solid #e4dcd3;

      border-bottom: 1px solid #e4dcd3;

      animation: fadeIn 0.35s ease;
    }

    .result.show {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome {
      font-family: "Cormorant Garamond", serif;

      font-size: 30px;

      font-weight: 500;

      color: #4e463f;

      margin-bottom: 10px;
    }

    .seated {
      font-size: 9px;

      font-weight: 500;

      letter-spacing: 2.5px;

      text-transform: uppercase;

      color: #9a8e83;

      margin-bottom: 4px;
    }

    .table-number {
      font-family: "Cormorant Garamond", serif;

      font-size: 55px;

      font-weight: 500;

      color: #39332e;

      margin-bottom: 10px;
    }

    .celebration {
      font-family: "Cormorant Garamond", serif;

      font-size: 21px;

      color: #81756b;
    }


    /* =========================================
       ERROR MESSAGE
    ========================================= */

    .error {
      display: none;

      max-width: 500px;

      margin: 20px auto 0;

      padding: 14px 18px;

      background: #f7f2ed;

      border: 1px solid #e4dbd2;

      border-radius: 4px;

      font-size: 11px;

      line-height: 1.6;

      color: #756b63;
    }

    .error.show {
      display: block;

      animation: fadeIn 0.25s ease;
    }


    /* =========================================
       BOTTOM DIVIDER
    ========================================= */

    .bottom-line {
      width: 32px;

      height: 1px;

      background: #b9ada3;

      margin: 35px auto 19px;
    }


    /* =========================================
       FOOTER
    ========================================= */

    .footer {
      font-family: "Cormorant Garamond", serif;

      font-size: 19px;

      color: #91857a;
    }

    .heart {
      display: block;

      margin-top: 10px;

      color: #ffffff;

      font-size: 15px;

      line-height: 1;

      /*
        Soft shadow ensures the white heart
        remains visible against the neutral background.
      */
      text-shadow:
        0 1px 3px rgba(70, 61, 53, 0.35);
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 700px) {

      body {
        padding: 18px;
      }

      .card {
        padding: 52px 34px 44px;
      }

      .names {
        font-size: clamp(46px, 10vw, 62px);
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 560px) {

      body {
        padding: 12px;

        align-items: flex-start;
      }

      .page {
        margin: 12px 0;
      }

      .card {
        padding: 43px 20px 38px;
      }


      /* Monogram */

      .monogram {
        width: 76px;
        height: 76px;

        margin-bottom: 24px;

        font-size: 23px;
      }

      .monogram::after {
        width: 64px;
        height: 64px;
      }


      /* Names */

      .names {
        font-size: clamp(43px, 13vw, 56px);

        line-height: 0.95;

        letter-spacing: -0.5px;
      }

      .ampersand {
        display: block;

        font-size: 0.48em;

        margin: 7px 0;
      }


      /* Subtitle */

      .subtitle {
        font-size: 8.5px;

        letter-spacing: 2.3px;

        margin-bottom: 40px;
      }


      /* Search */

      .search-heading {
        font-size: 28px;
      }

      .search-description {
        font-size: 11px;

        max-width: 260px;

        margin-left: auto;
        margin-right: auto;

        margin-bottom: 22px;
      }

      .search-container {
        padding: 8px;
      }

      .search-row {
        flex-direction: column;

        gap: 8px;
      }

      .input-wrapper {
        width: 100%;
      }

      input {
        height: 58px;

        padding-left: 42px;
      }

      .search-button {
        width: 100%;

        height: 56px;
      }

      .hint {
        line-height: 1.5;

        padding: 0 5px;
      }


      /* Result */

      .result {
        margin-top: 28px;

        padding: 27px 16px 25px;
      }

      .welcome {
        font-size: 28px;
      }

      .table-number {
        font-size: 51px;
      }

      .celebration {
        font-size: 19px;
      }


      /* Footer */

      .bottom-line {
        margin-top: 31px;
      }

      .footer {
        font-size: 18px;
      }

    }


    /* =========================================
       VERY SMALL PHONES
    ========================================= */

    @media (max-width: 360px) {

      .card {
        padding-left: 16px;
        padding-right: 16px;
      }

      .names {
        font-size: 42px;
      }

      .search-container {
        padding: 6px;
      }

    }


    /* =========================================
       REDUCED MOTION
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <section class="card">

      <!-- Elegant top detail -->
      <div class="top-line"></div>


      <!-- Circular E & S monogram -->
      <div class="monogram" aria-label="Edmund and Simone">
        E&nbsp;&amp;&nbsp;S
      </div>


      <!-- Edmund intentionally comes first -->
      <h1 class="names">
        Edmund
        <span class="ampersand">&amp;</span>
        Simone
      </h1>


      <p class="subtitle">
        Our Wedding Celebration
      </p>


      <!-- Search heading -->
      <h2 class="search-heading">
        Find your table
      </h2>

      <p class="search-description">
        Enter your first name or full name below
      </p>


      <!-- Search -->
      <div class="search-container">

        <div class="search-row">

          <div class="input-wrapper">

            <span class="input-icon" aria-hidden="true">
              ♡
            </span>

            <input
              type="text"
              id="guestName"
              placeholder="Enter your name"
              autocomplete="off"
              autocapitalize="words"
              spellcheck="false"
              aria-label="Enter your name"
            >

          </div>


          <button
            class="search-button"
            type="button"
            onclick="findTable()"
          >
            Find My Table
          </button>

        </div>


        <p class="hint">
          First name is enough, unless we have more than one guest with that name.
        </p>

      </div>


      <!-- Result -->
      <div
        id="result"
        class="result"
        aria-live="polite"
      >

        <div
          id="welcome"
          class="welcome"
        ></div>

        <div class="seated">
          You are seated at
        </div>

        <div
          id="tableNumber"
          class="table-number"
        ></div>

        <div class="celebration">
          We can't wait to celebrate with you ♡
        </div>

      </div>


      <!-- Error -->
      <div
        id="error"
        class="error"
        role="alert"
      ></div>


      <!-- Bottom detail -->
      <div class="bottom-line"></div>


      <!-- White heart + footer -->
      <div class="footer">
        With love, Edmund &amp; Simone

        <span class="heart" aria-hidden="true">
          ♥
        </span>
      </div>

    </section>

  </main>


  <script>

    /* =========================================

    /* =========================================
       FIND TABLE
    ========================================= */

    function findTable() {

      const inputElement =
        document.getElementById("guestName");

      const result =
        document.getElementById("result");

      const error =
        document.getElementById("error");

      const input =
        inputElement.value
          .trim()
          .toLowerCase();


      /* Reset previous messages */

      result.classList.remove("show");
      error.classList.remove("show");


      /* Empty input */

      if (!input) {

        error.textContent =
          "Please enter your name to find your table.";

        error.classList.add("show");

        inputElement.focus();

        return;
      }


      let matches = [];


      /* =========================================
         FIRST: EXACT FULL NAME MATCH
      ========================================= */

      for (const [table, guests] of Object.entries(tables)) {

        guests.forEach(guest => {

          if (guest.toLowerCase() === input) {

            matches.push({
              name: guest,
              table: table
            });

          }

        });

      }


      /* =========================================
         SECOND: FIRST NAME MATCH
      ========================================= */

      if (matches.length === 0) {

        for (const [table, guests] of Object.entries(tables)) {

          guests.forEach(guest => {

            const firstName =
              guest
                .split(" ")[0]
                .toLowerCase();

            if (firstName === input) {

              matches.push({
                name: guest,
                table: table
              });

            }

          });

        }

      }


      /* =========================================
         NO MATCH
      ========================================= */

      if (matches.length === 0) {

        error.textContent =
          "We couldn't find that name. Please check the spelling and try again.";

        error.classList.add("show");

        return;
      }


      /* =========================================
         MULTIPLE FIRST NAME MATCHES
      ========================================= */

      if (matches.length > 1) {

        const names =
          matches
            .map(person => person.name)
            .join(" or ");

        error.textContent =
          "We found more than one guest with that first name. Please enter your first and last name.";

        error.classList.add("show");

        return;
      }


      /* =========================================
         SUCCESS
      ========================================= */

      const guest = matches[0];


      const firstName =
        guest.name.split(" ")[0];


      document.getElementById("welcome").textContent =
        "Welcome, " + firstName + "!";


      document.getElementById("tableNumber").textContent =
        guest.table;


      result.classList.add("show");


      /* Move the result into view on mobile */

      setTimeout(() => {

        result.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      }, 100);

    }


    /* =========================================
       ENTER KEY SUPPORT
    ========================================= */

    document
      .getElementById("guestName")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          findTable();

        }

      });

  </script>
