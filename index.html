<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <!-- Responsive on iPhone, Android, tablet, laptop and desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#f5f1eb">

  <title>Simone & Eddie | Wedding Table Finder</title>


  <!-- Elegant wedding fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      width: 100%;
      min-height: 100%;
    }


    body {

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      background:
        radial-gradient(
          circle at 50% 0%,
          #fbfaf7 0%,
          #f5f1eb 45%,
          #ebe4da 100%
        );

      color: #3d3935;

      font-family: "Montserrat", sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      overflow-x: hidden;
    }


    /* =====================================================
       MAIN WRAPPER
    ===================================================== */

    .page {
      width: 100%;
      max-width: 760px;
      margin: auto;
    }


    /* =====================================================
       CARD
    ===================================================== */

    .card {

      width: 100%;

      background: rgba(253, 251, 248, 0.97);

      border: 1px solid #ded6cc;

      box-shadow:
        0 25px 80px rgba(70, 60, 50, 0.10);

      text-align: center;

      padding: 65px 70px;
    }


    /* =====================================================
       TOP LABEL
    ===================================================== */

    .eyebrow {

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #93887b;

      margin-bottom: 25px;
    }


    /* =====================================================
       MONOGRAM
    ===================================================== */

    .monogram {

      width: 58px;
      height: 58px;

      margin: 0 auto 28px;

      border: 1px solid #cec4b8;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Cormorant Garamond", serif;

      font-size: 23px;

      color: #756b61;
    }


    /* =====================================================
       NAMES
    ===================================================== */

    .names {

      font-family: "Cormorant Garamond", serif;

      font-size: clamp(58px, 9vw, 86px);

      font-weight: 500;

      line-height: 0.82;

      color: #37332f;
    }


    .and {

      font-family: "Cormorant Garamond", serif;

      font-size: 28px;

      font-style: italic;

      color: #9b9083;

      margin: 17px 0;
    }


    /* =====================================================
       INTRO
    ===================================================== */

    .intro {

      max-width: 480px;

      margin: 36px auto 40px;

      font-size: 13px;

      line-height: 1.9;

      color: #756e67;
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .search {

      width: 100%;

      max-width: 540px;

      margin: 0 auto;
    }


    .input-label {

      display: block;

      font-size: 9px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #968b80;

      margin-bottom: 9px;
    }


    .search-row {

      display: flex;

      width: 100%;

      gap: 10px;
    }


    input {

      flex: 1;

      min-width: 0;

      height: 58px;

      padding: 0 20px;

      border: 1px solid #d3cbc1;

      background: #fffefa;

      color: #393531;

      font-family: "Montserrat", sans-serif;

      font-size: 16px;

      outline: none;

      border-radius: 0;

      -webkit-appearance: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }


    input::placeholder {
      color: #aaa39b;
    }


    input:focus {

      border-color: #93877b;

      box-shadow:
        0 0 0 3px rgba(147, 135, 123, 0.08);
    }


    button {

      height: 58px;

      padding: 0 28px;

      flex-shrink: 0;

      border: none;

      background: #47423d;

      color: #ffffff;

      font-family: "Montserrat", sans-serif;

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 2px;

      text-transform: uppercase;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      transition:
        background 0.2s ease,
        transform 0.15s ease;
    }


    button:hover {

      background: #302d2a;
    }


    button:active {

      transform: scale(0.98);
    }


    /* =====================================================
       RESULT
    ===================================================== */

    .result {

      display: none;

      max-width: 540px;

      margin: 35px auto 0;

      padding: 34px 20px;

      border-top: 1px solid #ded6cc;

      border-bottom: 1px solid #ded6cc;

      animation: fadeIn 0.4s ease;
    }


    .result.show {
      display: block;
    }


    .welcome {

      font-family: "Cormorant Garamond", serif;

      font-size: 36px;

      font-weight: 500;

      color: #393531;

      margin-bottom: 19px;
    }


    .table-label {

      font-size: 9px;

      letter-spacing: 3px;

      text-transform: uppercase;

      color: #93887b;

      margin-bottom: 5px;
    }


    .table-number {

      font-family: "Cormorant Garamond", serif;

      font-size: 62px;

      font-weight: 500;

      line-height: 1;

      color: #393531;
    }


    .celebrate {

      margin-top: 18px;

      font-family: "Cormorant Garamond", serif;

      font-size: 20px;

      font-style: italic;

      color: #756d64;

      line-height: 1.5;
    }


    /* =====================================================
       ERROR
    ===================================================== */

    .error {

      display: none;

      max-width: 540px;

      margin: 20px auto 0;

      padding: 14px 16px;

      border: 1px solid #e1d5cc;

      background: #f5efeb;

      color: #806a62;

      font-size: 12px;

      line-height: 1.6;
    }


    .error.show {

      display: block;

      animation: fadeIn 0.3s ease;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {

      margin-top: 32px;

      font-family: "Cormorant Garamond", serif;

      font-size: 19px;

      color: #8b8176;
    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* =====================================================
       TABLETS
    ===================================================== */

    @media (max-width: 700px) {

      body {
        padding: 20px;
      }

      .card {
        padding: 55px 35px;
      }

      .names {
        font-size: clamp(54px, 13vw, 72px);
      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 560px) {

      body {

        align-items: flex-start;

        padding: 14px;
      }


      .page {

        margin-top: 14px;
        margin-bottom: 14px;
      }


      .card {

        padding: 43px 20px 38px;

        box-shadow:
          0 15px 45px rgba(70, 60, 50, 0.08);
      }


      .eyebrow {

        font-size: 9px;

        letter-spacing: 3px;

        margin-bottom: 21px;
      }


      .monogram {

        width: 52px;
        height: 52px;

        margin-bottom: 23px;

        font-size: 21px;
      }


      .names {

        font-size: clamp(49px, 16vw, 68px);
      }


      .and {

        font-size: 24px;

        margin: 14px 0;
      }


      .intro {

        margin: 30px auto 32px;

        font-size: 12px;

        line-height: 1.8;
      }


      .search {

        max-width: 100%;
      }


      .input-label {

        font-size: 8px;

        margin-bottom: 8px;
      }


      /* Stack input and button on phones */

      .search-row {

        flex-direction: column;

        gap: 9px;
      }


      input {

        width: 100%;

        height: 58px;

        font-size: 16px;

        text-align: center;
      }


      button {

        width: 100%;

        height: 58px;

        padding: 0 15px;

        font-size: 10px;
      }


      .result {

        margin-top: 30px;

        padding: 29px 10px;
      }


      .welcome {

        font-size: 31px;

        margin-bottom: 17px;
      }


      .table-number {

        font-size: 57px;
      }


      .celebrate {

        font-size: 18px;

        margin-top: 16px;
      }


      .footer {

        margin-top: 27px;

        font-size: 18px;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
    ===================================================== */

    @media (max-width: 370px) {

      body {
        padding: 10px;
      }


      .card {
        padding: 37px 17px 32px;
      }


      .names {
        font-size: 48px;
      }


      .intro {
        font-size: 11.5px;
      }


      .welcome {
        font-size: 28px;
      }

    }


    /* =====================================================
       LARGE DESKTOP
    ===================================================== */

    @media (min-width: 1000px) {

      body {
        padding: 60px;
      }


      .page {
        max-width: 820px;
      }


      .card {
        padding: 80px 90px;
      }


      .eyebrow {
        margin-bottom: 28px;
      }


      .intro {
        font-size: 14px;

        margin-top: 40px;

        margin-bottom: 44px;
      }


      .search {
        max-width: 580px;
      }

    }

  </style>

</head>


<body>


  <main class="page">

    <section class="card">


      <!-- HEADER -->

      <div class="eyebrow">
        Welcome to our wedding
      </div>


      <!-- MONOGRAM -->

      <div class="monogram">
        S&nbsp;&amp;&nbsp;E
      </div>


      <!-- COUPLE -->

        Simone
      </div>

      <div class="and">

      </div>

      <div class="names">
        Eddie
      </div>


      <!-- INTRO -->

      <p class="intro">

        We're so happy you're here.
        Please enter your name below to find your table

      </p>


      <!-- SEARCH -->

      <div class="search">

        <label
          class="input-label"
          for="nameInput"
        >
          Find your table
        </label>


        <div class="search-row">

          <input
            id="nameInput"
            type="text"
            placeholder="Enter your first or full name"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            aria-label="Enter your first or full name"
          >


          <button
            id="findButton"
            type="button"
          >
            Find My Table
          </button>

        </div>

      </div>


      <!-- RESULT -->

      <div
        id="result"
        class="result"
        aria-live="polite"
      >

        <div
          id="welcome"
          class="welcome"
        ></div>


        <div class="table-label">
          You are seated at
        </div>


        <div
          id="tableNumber"
          class="table-number"
        ></div>


        <div class="celebrate">
          We can't wait to celebrate with you ♡
        </div>

      </div>


      <!-- ERROR -->

      <div
        id="error"
        class="error"
        aria-live="polite"
      ></div>


      <!-- FOOTER -->

      <div class="footer">
        With love, Simone &amp; Eddie
      </div>


    </section>

  </main>

    /* =====================================================
       NORMALISE SEARCH
    ===================================================== */

    function normalise(value) {

      return value
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");

    }



    /* =====================================================
       FIRST NAME
    ===================================================== */

    function getFirstName(fullName) {

      return fullName.split(" ")[0];

    }



    /* =====================================================
       FIND TABLE
    ===================================================== */

    function findTable() {

      const input =
        document.getElementById("nameInput").value;

      const searchTerm =
        normalise(input);

      const result =
        document.getElementById("result");

      const error =
        document.getElementById("error");

      const welcome =
        document.getElementById("welcome");

      const tableNumber =
        document.getElementById("tableNumber");


      /* Reset */

      result.classList.remove("show");

      error.classList.remove("show");

      error.innerHTML = "";


      /* Empty search */

      if (!searchTerm) {

        error.innerHTML =
          "Please enter your name to find your table.";

        error.classList.add("show");

        return;
      }


      /* ==================================================
         EXACT FULL NAME SEARCH
      ================================================== */

      let matches = guests.filter(function(guest) {

        return normalise(guest.name) === searchTerm;

      });


      /* ==================================================
         PARTIAL SEARCH
      ================================================== */

      if (matches.length === 0) {

        matches = guests.filter(function(guest) {

          return normalise(guest.name)
            .includes(searchTerm);

        });

      }


      /* ==================================================
         NO MATCH
      ================================================== */

      if (matches.length === 0) {

        error.innerHTML =
          "We couldn't find that name. " +
          "Please check the spelling and try again.";

        error.classList.add("show");

        return;
      }


      /* ==================================================
         MULTIPLE MATCHES
      ================================================== */

      if (matches.length > 1) {

        error.innerHTML =
          "We found more than one guest with that name. " +
          "Please enter your first and last name.";

        error.classList.add("show");

        return;
      }


      /* ==================================================
         MATCH FOUND
      ================================================== */

      const guest = matches[0];


      welcome.textContent =
        "Welcome, " + getFirstName(guest.name) + "!";


      tableNumber.textContent =
        guest.table;


      result.classList.add("show");


      /* Bring result into view on phones */

      setTimeout(function() {

        result.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      }, 100);

    }



    /* =====================================================
       BUTTON
    ===================================================== */

    document
      .getElementById("findButton")
      .addEventListener("click", findTable);



    /* =====================================================
       ENTER KEY
    ===================================================== */

    document
      .getElementById("nameInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          findTable();

        }

      });



    /* =====================================================
       REMOVE ERROR WHEN USER TYPES AGAIN
    ===================================================== */

    document
      .getElementById("nameInput")
      .addEventListener("input", function() {

        document
          .getElementById("error")
          .classList.remove("show");

      });

  </script>
