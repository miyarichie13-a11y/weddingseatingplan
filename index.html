<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simone & Edmund | Wedding Seating</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #f5f1eb;
      color: #3f3a35;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .card {
      background: #fffdfa;
      border: 1px solid #e6ded5;
      padding: 70px 60px;
      box-shadow: 0 12px 40px rgba(63, 58, 53, 0.06);
    }

    .monogram {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      letter-spacing: 4px;
      color: #82766b;
      margin-bottom: 26px;
    }

    .names {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(48px, 8vw, 72px);
      font-weight: 500;
      line-height: 0.95;
      color: #3f3a35;
      margin-bottom: 20px;
    }

    .ampersand {
      font-size: 0.65em;
      font-weight: 400;
      color: #9b8f83;
      margin: 0 7px;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8c8177;
      margin-bottom: 48px;
    }

    .instruction {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      color: #514a44;
      margin-bottom: 22px;
    }

    .search-area {
      background: #f8f4ef;
      border: 1px solid #e3dbd2;
      padding: 26px;
      margin: 0 auto;
      max-width: 570px;
    }

    .search-row {
      display: flex;
      gap: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 58px;
      border: 1px solid #d8cec4;
      background: #fffdfa;
      padding: 0 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      color: #3f3a35;
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #aaa098;
    }

    input:focus {
      border-color: #9b8f83;
      box-shadow: 0 0 0 3px rgba(155, 143, 131, 0.10);
    }

    button {
      height: 58px;
      padding: 0 28px;
      border: none;
      background: #6f665e;
      color: #fffdfa;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: #554e48;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .hint {
      font-size: 11px;
      color: #9b9188;
      margin-top: 16px;
    }

    .result {
      display: none;
      margin: 36px auto 0;
      padding: 32px 24px;
      border-top: 1px solid #e5ddd4;
      border-bottom: 1px solid #e5ddd4;
      max-width: 570px;
    }

    .result.show {
      display: block;
    }

    .welcome {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      color: #514a44;
      margin-bottom: 10px;
    }

    .seated {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #93877c;
      margin-bottom: 7px;
    }

    .table-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 58px;
      font-weight: 500;
      color: #3f3a35;
      margin-bottom: 14px;
    }

    .celebration {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      color: #746a61;
    }

    .error {
      display: none;
      margin-top: 22px;
      font-size: 13px;
      line-height: 1.6;
      color: #81766d;
    }

    .error.show {
      display: block;
    }

    .footer {
      margin-top: 34px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: #9a8e84;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
        align-items: center;
      }

      .card {
        padding: 48px 22px;
      }

      .monogram {
        font-size: 28px;
        margin-bottom: 20px;
      }

      .names {
        font-size: clamp(42px, 13vw, 58px);
        line-height: 1;
      }

      .ampersand {
        display: block;
        font-size: 0.5em;
        margin: 5px 0;
      }

      .subtitle {
        font-size: 9px;
        letter-spacing: 2.2px;
        margin-bottom: 38px;
      }

      .instruction {
        font-size: 23px;
        margin-bottom: 20px;
      }

      .search-area {
        padding: 20px;
      }

      .search-row {
        flex-direction: column;
        gap: 12px;
      }

      input,
      button {
        width: 100%;
        height: 58px;
      }

      button {
        padding: 0 20px;
      }

      .result {
        margin-top: 30px;
        padding: 28px 18px;
      }

      .welcome {
        font-size: 27px;
      }

      .table-number {
        font-size: 52px;
      }

      .celebration {
        font-size: 19px;
      }
    }

    @media (min-width: 601px) and (max-width: 800px) {
      .card {
        padding: 60px 40px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="card">

      <div class="monogram">S & E</div>

      <!-- Edmund is intentionally FIRST -->
      <h1 class="names">
        Edmund <span class="ampersand">&</span> Simone
      </h1>

      <p class="subtitle">Our Wedding Celebration</p>

      <h2 class="instruction">Find your table</h2>

      <div class="search-area">

        <div class="search-row">
          <input
            type="text"
            id="guestName"
            placeholder="Enter your first or full name"
            autocomplete="off"
            aria-label="Enter your name"
          >

          <button onclick="findTable()">
            Find My Table
          </button>
        </div>

        <p class="hint">
          You can enter your first name or your full name
        </p>

      </div>

      <div id="result" class="result">
        <div id="welcome" class="welcome"></div>
        <div class="seated">You are seated at</div>
        <div id="tableNumber" class="table-number"></div>
        <div class="celebration">
          We can't wait to celebrate with you ♡
        </div>
      </div>

      <div id="error" class="error"></div>

      <div class="footer">
        With love, Edmund & Simone
      </div>

    </section>
  </main>


  <script>

      "Table 8": [

      "Table 9": [

      ]

    function findTable() {

      const input = document
        .getElementById("guestName")
        .value
        .trim()
        .toLowerCase();

      const result = document.getElementById("result");
      const error = document.getElementById("error");

      result.classList.remove("show");
      error.classList.remove("show");

      if (!input) {
        error.textContent = "Please enter your name to find your table.";
        error.classList.add("show");
        return;
      }


      let matches = [];


      // Search all guests
      for (const [table, guests] of Object.entries(tables)) {

        guests.forEach(guest => {

          const guestLower = guest.toLowerCase();

          // Exact full-name match
          if (guestLower === input) {
            matches.push({
              name: guest,
              table: table
            });
          }

        });

      }


      // If no exact match, search by first name
      if (matches.length === 0) {

        for (const [table, guests] of Object.entries(tables)) {

          guests.forEach(guest => {

            const firstName = guest
              .split(" ")[0]
              .toLowerCase();

            if (firstName === input) {
              matches.push({
                name: guest,
                table: table
              });
            }

          });

        }

      }


      // No match
      if (matches.length === 0) {

        error.textContent =
          "We couldn't find that name. Please check the spelling and try again.";

        error.classList.add("show");
        return;
      }


      // More than one person with same first name
      if (matches.length > 1) {

        const names = matches
          .map(person => person.name)
          .join(" or ");

        error.textContent =
          "We found more than one guest with that first name. Please enter your first and last name, for example: " + names;

        error.classList.add("show");
        return;
      }


      const guest = matches[0];


      // Get first name for welcome message
      const firstName = guest.name.split(" ")[0];


      document.getElementById("welcome").textContent =
        "Welcome, " + firstName + "!";

      document.getElementById("tableNumber").textContent =
        guest.table;

      result.classList.add("show");


      // Smoothly scroll to result on mobile
      setTimeout(() => {

        result.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      }, 100);

    }


    // Allow Enter key to search
    document.getElementById("guestName").addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          findTable();
        }

      }
    );

  </script>

</body>
</html>
